name: native x64 release proof

on:
  pull_request:
    branches:
      - swxtch
    paths:
      - .github/workflows/opencode-arm-release-x64.yml
      - packages/opencode/script/release-probe.ts
      - packages/opencode/script/release-probe-process.ts
      - packages/opencode/script/release-probe-requests.ts
      - packages/opencode/script/release-probe-target.ts
      - packages/opencode/script/release-probe-delay-wait.preload.ts
      - packages/opencode/test/release-probe-tools.test.ts
      - packages/opencode/test/release-probe-wait-absence.test.ts
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to rebuild and verify
        required: true
        type: string
        default: v1.18.32-swxtch.0ff0dfbc
      source_commit:
        description: Optional full commit SHA to verify against the selected tag
        required: false
        type: string
      version:
        description: Optional OPENCODE_VERSION to verify against the selected source
        required: false
        type: string
  repository_dispatch:
    types:
      - opencode-arm-release-proof

concurrency:
  group: native-x64-release-proof-${{ github.event.pull_request.number || inputs.release_tag || github.event.client_payload.release_tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RELEASE_PROBE_DEFAULT_TAG: v1.18.32-swxtch.0ff0dfbc
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  release-proof:
    if: github.repository == 'swxtchio/swx-opencode'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout proof harness
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node for source-pinned Bun installer
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Checkout selected release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.source_commit || github.event.client_payload.source_commit || inputs.release_tag || github.event.client_payload.release_tag || 'v1.18.32-swxtch.0ff0dfbc' }}
          path: source
          fetch-depth: 0

      - name: Resolve Bun version from selected source
        id: source-bun
        working-directory: source
        run: |
          set -euo pipefail
          bun_version=$(node -p "require('./package.json').packageManager.match(/^bun@([^+]+)/)?.[1] || ''")
          test -n "$bun_version"
          echo "version=$bun_version" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/oven-sh/bun/releases/download/bun-v${bun_version}/bun-linux-x64-baseline.zip" >> "$GITHUB_OUTPUT"

      - name: Install Bun pinned by selected source
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ !steps.source-bun.outputs.url && steps.source-bun.outputs.version || '' }}
          bun-download-url: ${{ steps.source-bun.outputs.url }}

      - name: Resolve and verify release inputs
        env:
          RELEASE_SOURCE_DIR: ${{ github.workspace }}/source
        run: bun run packages/opencode/script/release-probe-target.ts

      - name: Verify native runner and install selected source dependencies
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          command -v strace
          bun -e 'if (process.platform !== "linux" || process.arch !== "x64") throw new Error(`not a native linux-x64 runner: ${process.platform}-${process.arch}`); console.log(`Bun ${Bun.version} ${process.platform}-${process.arch}`)'
          test "$(bun --version)" = "$BUN_VERSION"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          git -C source merge-base --is-ancestor 4b87478ddf "$SOURCE_COMMIT"
          sha256sum source/bun.lock | tee "$RUNNER_TEMP/bun.lock.sha256"
          bun install --cwd source --frozen-lockfile --os=linux --cpu=x64

      - name: Typecheck and test release proof tooling
        run: |
          set -euo pipefail
          files=(
            packages/opencode/script/release-probe.ts
            packages/opencode/script/release-probe-delay-wait.preload.ts
            packages/opencode/script/release-probe-process.ts
            packages/opencode/script/release-probe-requests.ts
            packages/opencode/script/release-probe-target.ts
            packages/opencode/test/release-probe-tools.test.ts
            packages/opencode/test/release-probe-wait-absence.test.ts
          )
          tracked_files=()
          untracked_files=()
          backup="$RUNNER_TEMP/release-probe-original"
          mkdir -p "$backup"
          restore_proof_tools() {
            for file in "${tracked_files[@]}"; do cp "$backup/$file" "source/$file"; done
            for file in "${untracked_files[@]}"; do rm -f "source/$file"; done
          }
          trap restore_proof_tools EXIT
          for file in "${files[@]}"; do
            if git -C source cat-file -e "HEAD:$file" 2>/dev/null; then
              mkdir -p "$backup/$(dirname "$file")"
              git -C source show "HEAD:$file" > "$backup/$file"
              tracked_files+=("$file")
            else
              untracked_files+=("$file")
            fi
            cp "$GITHUB_WORKSPACE/$file" "source/$file"
          done
          (cd source/packages/opencode && bun run typecheck && bun test test/release-probe-tools.test.ts)
          restore_proof_tools
          trap - EXIT
          test -z "$(git -C source status --porcelain)"

      - name: Pin build data and build native linux-x64
        working-directory: source
        env:
          MODELS_DEV_API_JSON: ${{ runner.temp }}/models.dev.json
          OPENCODE_BUILD_DIST: ${{ runner.temp }}/opencode-dist
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error --max-time 180 \
            https://models.dev/api.json --output "$MODELS_DEV_API_JSON"
          sha256sum "$MODELS_DEV_API_JSON" | tee "$RUNNER_TEMP/models.dev.sha256"
          env -u OPENCODE_RELEASE -u OPENCODE_CHANNEL -u OPENCODE_BUMP -u GH_REPO \
            OPENCODE_VERSION="$OPENCODE_VERSION" \
            MODELS_DEV_API_JSON="$MODELS_DEV_API_JSON" \
            OPENCODE_BUILD_DIST="$OPENCODE_BUILD_DIST" \
            bun run packages/opencode/script/build.ts --single --skip-install 2>&1 | tee "$RUNNER_TEMP/build.log"
          test -x "$OPENCODE_BUILD_DIST/opencode-linux-x64/bin/opencode"
          test ! -e "$OPENCODE_BUILD_DIST/opencode-linux-arm64/bin/opencode"
          test -z "$(git status --porcelain)"

      - name: Package and attest extracted x64 archive
        env:
          OPENCODE_BUILD_DIST: ${{ runner.temp }}/opencode-dist
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/release-assets"
          extracted="$RUNNER_TEMP/release-extracted"
          proof="$RUNNER_TEMP/native-x64-proof"
          mkdir -p "$asset_dir" "$extracted" "$proof"
          bin="$OPENCODE_BUILD_DIST/opencode-linux-x64/bin"
          shopt -s nullglob
          sidecars=("$bin"/libfff_c-*.so)
          test "${#sidecars[@]}" -eq 1
          sidecar_name=$(basename "${sidecars[0]}")
          file "$bin/opencode" "${sidecars[0]}"
          tar -czf "$asset_dir/opencode-linux-x64.tar.gz" -C "$bin" opencode "$sidecar_name"
          (cd "$asset_dir" && sha256sum opencode-linux-x64.tar.gz > opencode-linux-x64.tar.gz.sha256 && sha256sum -c opencode-linux-x64.tar.gz.sha256)
          entries=$(tar -tzf "$asset_dir/opencode-linux-x64.tar.gz" | sort)
          expected=$(printf '%s\n' opencode "$sidecar_name" | sort)
          test "$entries" = "$expected"
          tar -xzf "$asset_dir/opencode-linux-x64.tar.gz" -C "$extracted"
          file "$extracted/opencode" "$extracted/$sidecar_name"
          version_output=$("$extracted/opencode" --version)
          test "$version_output" = "$OPENCODE_VERSION"
          printf '%s\n' "$version_output" | tee "$RUNNER_TEMP/x64-version.txt"
          OPENCODE_VERSION="$OPENCODE_VERSION" bun run packages/opencode/script/release-probe.ts \
            x64 "$extracted/opencode" "$proof" 2>&1 | tee "$RUNNER_TEMP/native-x64-proof.log"
          python3 - "$RUNNER_TEMP" "$RELEASE_TAG" "$SOURCE_COMMIT" "$OPENCODE_VERSION" "$BUN_VERSION" "$sidecar_name" <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          tag = sys.argv[2]
          source = sys.argv[3]
          version = sys.argv[4]
          bun_version = sys.argv[5]
          sidecar = sys.argv[6]
          archive = root / "release-assets/opencode-linux-x64.tar.gz"
          evidence = json.loads((root / "native-x64-proof/evidence.json").read_text())
          lock = (root / "bun.lock.sha256").read_text().split()[0]
          models = (root / "models.dev.sha256").read_text().split()[0]
          metadata = {
              "release_tag": tag,
              "source_commit": source,
              "version": version,
              "target": "linux-x64",
              "build_classification": "native target build and runtime on ubuntu-latest x86_64",
              "runner_arch": subprocess.check_output(["uname", "-m"], text=True).strip(),
              "bun_version": bun_version,
              "bun_lock_sha256": lock,
              "models_dev_sha256": models,
              "archive": archive.name,
              "archive_sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
              "binary_version": (root / "x64-version.txt").read_text().strip(),
              "fff_sidecar": sidecar,
              "proof": evidence,
          }
          (root / "x64-provenance.json").write_text(json.dumps(metadata, indent=2) + "\n")
          print(json.dumps(metadata, indent=2))
          PY

      - name: Prove held-wait dispatch suppression is rejected
        working-directory: source/packages/opencode
        env:
          RELEASE_PROBE_BINARY: ${{ runner.temp }}/release-extracted/opencode
          RELEASE_PROBE_ARCH: x64
          OPENCODE_VERSION: ${{ env.OPENCODE_VERSION }}
          RELEASE_PROBE_RED_EVIDENCE_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          files=(
            script/release-probe.ts
            script/release-probe-delay-wait.preload.ts
            script/release-probe-process.ts
            script/release-probe-requests.ts
            script/release-probe-target.ts
            test/release-probe-wait-absence.test.ts
          )
          tracked_files=()
          untracked_files=()
          backup="$RUNNER_TEMP/wait-absence-original"
          mkdir -p "$backup"
          restore_wait_proof() {
            for file in "${tracked_files[@]}"; do cp "$backup/$file" "$GITHUB_WORKSPACE/source/packages/opencode/$file"; done
            for file in "${untracked_files[@]}"; do rm -f "$GITHUB_WORKSPACE/source/packages/opencode/$file"; done
          }
          trap restore_wait_proof EXIT
          for file in "${files[@]}"; do
            if git -C "$GITHUB_WORKSPACE/source" cat-file -e "HEAD:packages/opencode/$file" 2>/dev/null; then
              mkdir -p "$backup/$(dirname "$file")"
              git -C "$GITHUB_WORKSPACE/source" show "HEAD:packages/opencode/$file" > "$backup/$file"
              tracked_files+=("$file")
            else
              untracked_files+=("$file")
            fi
            cp "$GITHUB_WORKSPACE/packages/opencode/$file" "$GITHUB_WORKSPACE/source/packages/opencode/$file"
          done
          bun test test/release-probe-wait-absence.test.ts
          restore_wait_proof
          trap - EXIT
          test -z "$(git -C "$GITHUB_WORKSPACE/source" status --porcelain)"

      - name: Upload x64 archive, checksum, and execution evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-linux-x64-release-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/release-assets/opencode-linux-x64.tar.gz
            ${{ runner.temp }}/release-assets/opencode-linux-x64.tar.gz.sha256
            ${{ runner.temp }}/native-x64-proof/evidence.json
            ${{ runner.temp }}/native-x64-proof/opencode-server.log
            ${{ runner.temp }}/native-x64-proof.log
            ${{ runner.temp }}/native-x64-wait-red-completed.log
            ${{ runner.temp }}/native-x64-wait-red-failed.log
            ${{ runner.temp }}/native-x64-wait-red-interrupted.log
            ${{ runner.temp }}/x64-version.txt
            ${{ runner.temp }}/x64-provenance.json
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/bun.lock.sha256
            ${{ runner.temp }}/models.dev.sha256
          if-no-files-found: error
          retention-days: 14
