name: native x64 release proof

on:
  pull_request:
    branches:
      - swxtch
    paths:
      - .github/workflows/opencode-arm-release-x64.yml
      - packages/core/src/session.ts
      - packages/core/src/session/execution.ts
      - packages/core/src/session/run-coordinator.ts
      - release-evidence.md
      - packages/opencode/script/release-probe.ts
      - packages/opencode/script/release-probe-process.ts
      - packages/opencode/script/release-probe-requests.ts
      - packages/opencode/script/release-probe-target.ts
      - packages/opencode/script/release-probe-delay-wait.preload.ts
      - packages/opencode/test/release-probe-tools.test.ts
      - packages/opencode/test/release-probe-wait-absence.test.ts
      - packages/opencode/test/release-probe-wait-socket-only.test.ts
      - packages/opencode/test/server/httpapi-wait-lifecycle.test.ts
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to rebuild and verify
        required: true
        type: string
        default: v1.18.32-swxtch.0ff0dfbc
      source_commit:
        description: Optional full commit SHA to verify against the selected tag
        required: false
        type: string
      version:
        description: Optional OPENCODE_VERSION to verify against the selected source
        required: false
        type: string
      candidate:
        description: Build a clean-source candidate before publication (requires full source_commit)
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types:
      - opencode-arm-release-proof

concurrency:
  group: native-x64-release-proof-${{ github.event.pull_request.number || inputs.release_tag || github.event.client_payload.release_tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RELEASE_PROBE_DEFAULT_TAG: v1.18.32-swxtch.0ff0dfbc
  PROOF_HARNESS_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  release-proof:
    if: github.repository == 'swxtchio/swx-opencode' && !inputs.candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout proof harness
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node for source-pinned Bun installer
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Checkout selected release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.source_commit || github.event.client_payload.source_commit || inputs.release_tag || github.event.client_payload.release_tag || 'v1.18.32-swxtch.0ff0dfbc' }}
          path: source
          fetch-depth: 0

      - name: Resolve Bun version from selected source
        id: source-bun
        working-directory: source
        run: |
          set -euo pipefail
          bun_version=$(node -p "require('./package.json').packageManager.match(/^bun@([^+]+)/)?.[1] || ''")
          test -n "$bun_version"
          echo "version=$bun_version" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/oven-sh/bun/releases/download/bun-v${bun_version}/bun-linux-x64-baseline.zip" >> "$GITHUB_OUTPUT"

      - name: Install Bun pinned by selected source
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ !steps.source-bun.outputs.url && steps.source-bun.outputs.version || '' }}
          bun-download-url: ${{ steps.source-bun.outputs.url }}

      - name: Resolve and verify release inputs
        env:
          RELEASE_SOURCE_DIR: ${{ github.workspace }}/source
        run: bun run packages/opencode/script/release-probe-target.ts

      - name: Verify native runner and install selected source dependencies
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          command -v strace
          bun -e 'if (process.platform !== "linux" || process.arch !== "x64") throw new Error(`not a native linux-x64 runner: ${process.platform}-${process.arch}`); console.log(`Bun ${Bun.version} ${process.platform}-${process.arch}`)'
          test "$(bun --version)" = "$BUN_VERSION"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          git -C source merge-base --is-ancestor 4b87478ddf "$SOURCE_COMMIT"
          sha256sum source/bun.lock | tee "$RUNNER_TEMP/bun.lock.sha256"
          bun install --cwd source --frozen-lockfile --os=linux --cpu=x64

      - name: Typecheck and test release proof tooling
        run: |
          set -euo pipefail
          # The release-wait implementation the proof overlays onto the release source, pinned to the last
          # revision it was proven at: a later revision of these files can depend on core surface the release
          # predates. Edits to their wait code are unproven here until this pin is bumped (swxtchio/swx-opencode#354).
          core_wait_pin=cd3f0ce2d5e55944df41fcf43a167f77e40c8483
          pinned_files=(
            packages/core/src/session.ts
            packages/core/src/session/execution.ts
            packages/core/src/session/run-coordinator.ts
          )
          files=(
            "${pinned_files[@]}"
            packages/opencode/script/release-probe.ts
            packages/opencode/script/release-probe-delay-wait.preload.ts
            packages/opencode/script/release-probe-process.ts
            packages/opencode/script/release-probe-requests.ts
            packages/opencode/script/release-probe-target.ts
            packages/opencode/test/release-probe-tools.test.ts
            packages/opencode/test/release-probe-wait-absence.test.ts
            packages/opencode/test/release-probe-wait-socket-only.test.ts
            packages/opencode/test/server/httpapi-wait-lifecycle.test.ts
          )
          tracked_files=()
          untracked_files=()
          backup="$RUNNER_TEMP/release-probe-original"
          mkdir -p "$backup"
          restore_proof_tools() {
            for file in "${tracked_files[@]}"; do cp "$backup/$file" "source/$file"; done
            for file in "${untracked_files[@]}"; do rm -f "source/$file"; done
          }
          trap restore_proof_tools EXIT
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$core_wait_pin"
          for file in "${files[@]}"; do
            if git -C source cat-file -e "HEAD:$file" 2>/dev/null; then
              mkdir -p "$backup/$(dirname "$file")"
              git -C source show "HEAD:$file" > "$backup/$file"
              tracked_files+=("$file")
            else
              untracked_files+=("$file")
            fi
            if printf '%s\n' "${pinned_files[@]}" | grep -qxF "$file"; then
              git -C "$GITHUB_WORKSPACE" show "$core_wait_pin:$file" > "source/$file"
            else
              cp "$GITHUB_WORKSPACE/$file" "source/$file"
            fi
          done
          (cd source/packages/core && bun run typecheck)
          (
            cd source/packages/opencode
            bun run typecheck
            bun test test/release-probe-tools.test.ts
            bun test test/release-probe-wait-socket-only.test.ts
            bun test test/server/httpapi-wait-lifecycle.test.ts
          )
          restore_proof_tools
          trap - EXIT
          test -z "$(git -C source status --porcelain)"

      - name: Pin build data and build native linux-x64
        working-directory: source
        env:
          MODELS_DEV_API_JSON: ${{ runner.temp }}/models.dev.json
          OPENCODE_BUILD_DIST: ${{ runner.temp }}/opencode-dist
        run: |
          set -euo pipefail
          files=(
            packages/core/src/session.ts
            packages/core/src/session/execution.ts
            packages/core/src/session/run-coordinator.ts
          )
          backup="$RUNNER_TEMP/wait-logger-original"
          mkdir -p "$backup"
          restore_wait_logger_source() {
            for file in "${files[@]}"; do cp "$backup/$file" "$file"; done
          }
          trap restore_wait_logger_source EXIT
          for file in "${files[@]}"; do
            mkdir -p "$backup/$(dirname "$file")"
            git show "HEAD:$file" > "$backup/$file"
            cp "$GITHUB_WORKSPACE/$file" "$file"
          done
          overlay_hash=$(git diff --binary -- "${files[@]}" | sha256sum)
          printf '%s\n' "${overlay_hash%% *}" > "$RUNNER_TEMP/wait-logging-overlay.sha256"
          curl --fail --location --retry 3 --silent --show-error --max-time 180 \
            https://models.dev/api.json --output "$MODELS_DEV_API_JSON"
          sha256sum "$MODELS_DEV_API_JSON" | tee "$RUNNER_TEMP/models.dev.sha256"
          env -u OPENCODE_RELEASE -u OPENCODE_CHANNEL -u OPENCODE_BUMP -u GH_REPO \
            OPENCODE_VERSION="$OPENCODE_VERSION" \
            MODELS_DEV_API_JSON="$MODELS_DEV_API_JSON" \
            OPENCODE_BUILD_DIST="$OPENCODE_BUILD_DIST" \
            bun run packages/opencode/script/build.ts --single --skip-install 2>&1 | tee "$RUNNER_TEMP/build.log"
          test -x "$OPENCODE_BUILD_DIST/opencode-linux-x64/bin/opencode"
          test ! -e "$OPENCODE_BUILD_DIST/opencode-linux-arm64/bin/opencode"
          restore_wait_logger_source
          trap - EXIT
          test -z "$(git status --porcelain)"

      - name: Package and attest instrumented x64 proof build
        env:
          OPENCODE_BUILD_DIST: ${{ runner.temp }}/opencode-dist
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/instrumented-proof-assets"
          extracted="$RUNNER_TEMP/instrumented-proof-extracted"
          proof="$RUNNER_TEMP/native-x64-proof"
          mkdir -p "$asset_dir" "$extracted" "$proof"
          bin="$OPENCODE_BUILD_DIST/opencode-linux-x64/bin"
          shopt -s nullglob
          sidecars=("$bin"/libfff_c-*.so)
          test "${#sidecars[@]}" -eq 1
          sidecar_name=$(basename "${sidecars[0]}")
          file "$bin/opencode" "${sidecars[0]}"
          tar -czf "$asset_dir/opencode-linux-x64-instrumented-proof.tar.gz" -C "$bin" opencode "$sidecar_name"
          (cd "$asset_dir" && sha256sum opencode-linux-x64-instrumented-proof.tar.gz > opencode-linux-x64-instrumented-proof.tar.gz.sha256 && sha256sum -c opencode-linux-x64-instrumented-proof.tar.gz.sha256)
          entries=$(tar -tzf "$asset_dir/opencode-linux-x64-instrumented-proof.tar.gz" | sort)
          expected=$(printf '%s\n' opencode "$sidecar_name" | sort)
          test "$entries" = "$expected"
          tar -xzf "$asset_dir/opencode-linux-x64-instrumented-proof.tar.gz" -C "$extracted"
          file "$extracted/opencode" "$extracted/$sidecar_name"
          version_output=$("$extracted/opencode" --version)
          test "$version_output" = "$OPENCODE_VERSION"
          printf '%s\n' "$version_output" | tee "$RUNNER_TEMP/x64-version.txt"
          OPENCODE_VERSION="$OPENCODE_VERSION" bun run packages/opencode/script/release-probe.ts \
            x64 "$extracted/opencode" "$proof" 2>&1 | tee "$RUNNER_TEMP/native-x64-proof.log"
          python3 - "$RUNNER_TEMP" "$RELEASE_TAG" "$SOURCE_COMMIT" "$OPENCODE_VERSION" "$BUN_VERSION" "$sidecar_name" "$PROOF_HARNESS_HEAD" <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          tag = sys.argv[2]
          source = sys.argv[3]
          version = sys.argv[4]
          bun_version = sys.argv[5]
          sidecar = sys.argv[6]
          proof_head = sys.argv[7]
          archive = root / "instrumented-proof-assets/opencode-linux-x64-instrumented-proof.tar.gz"
          evidence = json.loads((root / "native-x64-proof/evidence.json").read_text())
          lock = (root / "bun.lock.sha256").read_text().split()[0]
          models = (root / "models.dev.sha256").read_text().split()[0]
          wait_logging = (root / "wait-logging-overlay.sha256").read_text().strip()
          metadata = {
              "release_tag": tag,
              "release_source_commit": source,
              "proof_harness_head": proof_head,
              "version": version,
              "target": "linux-x64",
              "build_classification": "same-source native x64 rebuild with producer wait lifecycle log instrumentation; proof-only, not the published archive",
              "runner_arch": subprocess.check_output(["uname", "-m"], text=True).strip(),
              "bun_version": bun_version,
              "bun_lock_sha256": lock,
              "models_dev_sha256": models,
              "wait_logging_overlay_sha256": wait_logging,
              "archive": archive.name,
              "archive_sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
              "binary_version": (root / "x64-version.txt").read_text().strip(),
              "fff_sidecar": sidecar,
              "proof": evidence,
          }
          (root / "x64-provenance.json").write_text(json.dumps(metadata, indent=2) + "\n")
          print(json.dumps(metadata, indent=2))
          PY

      - name: Download and execute published x64 bytes
        run: |
          set -euo pipefail
          published="$RUNNER_TEMP/published-x64"
          extracted="$RUNNER_TEMP/published-x64-extracted"
          workspace="$RUNNER_TEMP/published-x64-workspace"
          published_xdg="$RUNNER_TEMP/published-x64-xdg-data"
          published_db="$RUNNER_TEMP/published-x64.sqlite"
          mkdir -p "$published" "$extracted" "$workspace/src/nested" "$published_xdg" "$RUNNER_TEMP/published-x64-home"
          release_url="https://github.com/swxtchio/swx-opencode/releases/download/$RELEASE_TAG"
          curl --fail --location --retry 3 --silent --show-error --max-time 300 \
            "$release_url/opencode-linux-x64.tar.gz" --output "$published/opencode-linux-x64.tar.gz"
          curl --fail --location --retry 3 --silent --show-error --max-time 60 \
            "$release_url/opencode-linux-x64.tar.gz.sha256" --output "$published/opencode-linux-x64.tar.gz.sha256"
          (cd "$published" && sha256sum -c opencode-linux-x64.tar.gz.sha256)
          entries=$(tar -tzf "$published/opencode-linux-x64.tar.gz" | sort)
          tar -xzf "$published/opencode-linux-x64.tar.gz" -C "$extracted"
          shopt -s nullglob
          sidecars=("$extracted"/libfff_c-*.so)
          test "${#sidecars[@]}" -eq 1
          sidecar_name=$(basename "${sidecars[0]}")
          expected=$(printf '%s\n' opencode "$sidecar_name" | sort)
          test "$entries" = "$expected"
          published_bin="$extracted/opencode"
          file "$published_bin" "${sidecars[0]}"
          published_version=$("$published_bin" --version)
          test "$published_version" = "$OPENCODE_VERSION"
          printf '%s\n' "$published_version" | tee "$RUNNER_TEMP/published-x64-version.txt"
          printf 'export const releaseProof = true\n' > "$workspace/src/nested/needle-target.ts"
          git -C "$workspace" init --quiet
          git -C "$workspace" add src/nested/needle-target.ts
          git -C "$workspace" -c user.name='OpenCode published-byte proof' -c user.email='release-probe@example.invalid' commit --quiet -m 'published x64 proof project'
          published_search=$(cd "$workspace" && HOME="$RUNNER_TEMP/published-x64-home" XDG_DATA_HOME="$published_xdg" \
            OPENCODE_DB="$published_db" OPENCODE_PURE=1 OPENCODE_DISABLE_MODELS_FETCH=1 OPENCODE_DISABLE_AUTOUPDATE=1 \
            "$published_bin" debug file search needle-target)
          case "$published_search" in *needle-target.ts*) ;; *) printf '%s\n' "$published_search"; exit 1 ;; esac
          printf '%s\n' "$published_search" | tee "$RUNNER_TEMP/published-x64-fff-search.txt"
          published_db_path=$(XDG_DATA_HOME="$published_xdg" OPENCODE_DB="$published_db" "$published_bin" db path)
          test "$published_db_path" = "$published_db"
          printf '%s\n' "$published_db_path" | tee "$RUNNER_TEMP/published-x64-db-path.txt"
          published_query=$(XDG_DATA_HOME="$published_xdg" OPENCODE_DB="$published_db" "$published_bin" db 'SELECT 1')
          test "$published_query" = $'1\n1'
          python3 - "$RUNNER_TEMP" "$RELEASE_TAG" "$SOURCE_COMMIT" "$OPENCODE_VERSION" "$sidecar_name" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          metadata = {
              "release_tag": sys.argv[2],
              "release_source_commit": sys.argv[3],
              "version": sys.argv[4],
              "target": "linux-x64",
              "run_kind": "downloaded published bytes; held-wait lifecycle logs are not in this release binary",
              "archive": "opencode-linux-x64.tar.gz",
              "archive_sha256": hashlib.sha256((root / "published-x64/opencode-linux-x64.tar.gz").read_bytes()).hexdigest(),
              "binary_sha256": hashlib.sha256((root / "published-x64-extracted/opencode").read_bytes()).hexdigest(),
              "fff_sidecar": sys.argv[5],
              "fff_sidecar_sha256": hashlib.sha256((root / "published-x64-extracted" / sys.argv[5]).read_bytes()).hexdigest(),
              "version_output": (root / "published-x64-version.txt").read_text().strip(),
              "database_path": (root / "published-x64-db-path.txt").read_text().strip(),
              "fff_search": (root / "published-x64-fff-search.txt").read_text().strip(),
          }
          (root / "published-x64-readback.json").write_text(json.dumps(metadata, indent=2) + "\n")
          print(json.dumps(metadata, indent=2))
          PY

      - name: Prove producer wait registration and attack rejection
        working-directory: source/packages/opencode
        env:
          RELEASE_PROBE_BINARY: ${{ runner.temp }}/instrumented-proof-extracted/opencode
          RELEASE_PROBE_SOCKET_ONLY_BINARY: ${{ runner.temp }}/published-x64-extracted/opencode
          RELEASE_PROBE_ARCH: x64
          OPENCODE_VERSION: ${{ env.OPENCODE_VERSION }}
          RELEASE_PROBE_RED_EVIDENCE_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          files=(
            script/release-probe.ts
            script/release-probe-delay-wait.preload.ts
            script/release-probe-process.ts
            script/release-probe-requests.ts
            script/release-probe-target.ts
            test/release-probe-wait-absence.test.ts
            test/release-probe-wait-socket-only.test.ts
          )
          tracked_files=()
          untracked_files=()
          backup="$RUNNER_TEMP/wait-absence-original"
          mkdir -p "$backup"
          restore_wait_proof() {
            for file in "${tracked_files[@]}"; do cp "$backup/$file" "$GITHUB_WORKSPACE/source/packages/opencode/$file"; done
            for file in "${untracked_files[@]}"; do rm -f "$GITHUB_WORKSPACE/source/packages/opencode/$file"; done
          }
          trap restore_wait_proof EXIT
          for file in "${files[@]}"; do
            if git -C "$GITHUB_WORKSPACE/source" cat-file -e "HEAD:packages/opencode/$file" 2>/dev/null; then
              mkdir -p "$backup/$(dirname "$file")"
              git -C "$GITHUB_WORKSPACE/source" show "HEAD:packages/opencode/$file" > "$backup/$file"
              tracked_files+=("$file")
            else
              untracked_files+=("$file")
            fi
            cp "$GITHUB_WORKSPACE/packages/opencode/$file" "$GITHUB_WORKSPACE/source/packages/opencode/$file"
          done
          bun test test/release-probe-wait-absence.test.ts
          bun test test/release-probe-wait-socket-only.test.ts
          restore_wait_proof
          trap - EXIT
          test -z "$(git -C "$GITHUB_WORKSPACE/source" status --porcelain)"

      - name: Upload instrumented proof and published-byte evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-linux-x64-round4-proof-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/instrumented-proof-assets/opencode-linux-x64-instrumented-proof.tar.gz
            ${{ runner.temp }}/instrumented-proof-assets/opencode-linux-x64-instrumented-proof.tar.gz.sha256
            ${{ runner.temp }}/native-x64-proof/evidence.json
            ${{ runner.temp }}/native-x64-proof/opencode-server.log
            ${{ runner.temp }}/native-x64-proof.log
            ${{ runner.temp }}/native-x64-wait-red-completed.log
            ${{ runner.temp }}/native-x64-wait-red-failed.log
            ${{ runner.temp }}/native-x64-wait-red-interrupted.log
            ${{ runner.temp }}/native-x64-wait-red-partial-prefix.log
            ${{ runner.temp }}/native-x64-wait-red-partial-prefix-trace.log
            ${{ runner.temp }}/native-x64-wait-socket-only.log
            ${{ runner.temp }}/native-x64-socket-only-producer-trace.log
            ${{ runner.temp }}/x64-version.txt
            ${{ runner.temp }}/x64-provenance.json
            ${{ runner.temp }}/published-x64/opencode-linux-x64.tar.gz.sha256
            ${{ runner.temp }}/published-x64-readback.json
            ${{ runner.temp }}/published-x64-version.txt
            ${{ runner.temp }}/published-x64-db-path.txt
            ${{ runner.temp }}/published-x64-fff-search.txt
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/bun.lock.sha256
            ${{ runner.temp }}/models.dev.sha256
            ${{ runner.temp }}/wait-logging-overlay.sha256
          if-no-files-found: error
          retention-days: 14

  release-candidate:
    if: github.repository == 'swxtchio/swx-opencode' && github.event_name == 'workflow_dispatch' && inputs.candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout release harness
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node for source-pinned Bun installer
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Checkout immutable candidate source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.source_commit }}
          path: source
          fetch-depth: 0

      - name: Resolve Bun version from selected source
        id: candidate-bun
        working-directory: source
        run: |
          set -euo pipefail
          bun_version=$(node -p "require('./package.json').packageManager.match(/^bun@([^+]+)/)?.[1] || ''")
          test -n "$bun_version"
          echo "url=https://github.com/oven-sh/bun/releases/download/bun-v${bun_version}/bun-linux-x64-baseline.zip" >> "$GITHUB_OUTPUT"

      - name: Install Bun pinned by selected source
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-download-url: ${{ steps.candidate-bun.outputs.url }}

      - name: Resolve candidate identity and refuse conflicting existing tags
        env:
          RELEASE_SOURCE_DIR: ${{ github.workspace }}/source
        run: bun run packages/opencode/script/release-probe-target.ts --candidate

      - name: Verify native runner and install frozen linux-x64 dependencies
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate-evidence"
          test "$(uname -m)" = x86_64
          uname -a | tee "$RUNNER_TEMP/candidate-evidence/host.txt"
          bun -e 'if (process.platform !== "linux" || process.arch !== "x64") throw new Error("not native linux-x64"); console.log(`Bun ${Bun.version} ${process.platform}-${process.arch}`)' | tee "$RUNNER_TEMP/candidate-evidence/bun.txt"
          test "$(bun --version)" = "$BUN_VERSION"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          git -C source merge-base --is-ancestor 4b87478ddf "$SOURCE_COMMIT"
          test -z "$(git -C source status --porcelain)"
          git -C source status --porcelain=v1 | tee "$RUNNER_TEMP/candidate-evidence/source-before.txt"
          sha256sum source/bun.lock | tee "$RUNNER_TEMP/candidate-evidence/bun.lock.sha256"
          bun install --cwd source --frozen-lockfile --os=linux --cpu=x64
          test -z "$(git -C source status --porcelain)"

      - name: Build the clean selected source with pinned catalog and version
        working-directory: source
        env:
          MODELS_DEV_API_JSON: ${{ runner.temp }}/candidate-evidence/models.dev.json
          OPENCODE_BUILD_DIST: ${{ runner.temp }}/candidate-dist
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          curl --fail --location --retry 3 --silent --show-error --max-time 180 \
            https://models.dev/api.json --output "$MODELS_DEV_API_JSON"
          sha256sum "$MODELS_DEV_API_JSON" | tee "$RUNNER_TEMP/candidate-evidence/models.dev.sha256"
          env -u OPENCODE_RELEASE -u OPENCODE_CHANNEL -u OPENCODE_BUMP -u GH_REPO \
            OPENCODE_VERSION="$OPENCODE_VERSION" \
            MODELS_DEV_API_JSON="$MODELS_DEV_API_JSON" \
            OPENCODE_BUILD_DIST="$OPENCODE_BUILD_DIST" \
            bun run packages/opencode/script/build.ts --single --skip-install 2>&1 | tee "$RUNNER_TEMP/candidate-evidence/build.log"
          test -z "$(git status --porcelain)"
          git status --porcelain=v1 | tee "$RUNNER_TEMP/candidate-evidence/source-after.txt"

      - name: Package and verify the exact native x64 candidate bytes
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/candidate-assets"
          extracted="$RUNNER_TEMP/candidate-extracted"
          bin="$RUNNER_TEMP/candidate-dist/opencode-linux-x64/bin"
          mkdir -p "$assets" "$extracted"
          shopt -s nullglob
          sidecars=("$bin"/libfff_c-*.so)
          test "${#sidecars[@]}" -eq 1
          sidecar_name=$(basename "${sidecars[0]}")
          file "$bin/opencode" "${sidecars[0]}" | tee "$RUNNER_TEMP/candidate-evidence/files.txt"
          tar -czf "$assets/opencode-linux-x64.tar.gz" -C "$bin" opencode "$sidecar_name"
          (cd "$assets" && sha256sum opencode-linux-x64.tar.gz > opencode-linux-x64.tar.gz.sha256 && sha256sum -c opencode-linux-x64.tar.gz.sha256)
          entries=$(tar -tzf "$assets/opencode-linux-x64.tar.gz" | sort)
          expected=$(printf '%s\n' opencode "$sidecar_name" | sort)
          test "$entries" = "$expected"
          tar -xzf "$assets/opencode-linux-x64.tar.gz" -C "$extracted"
          version_output=$("$extracted/opencode" --version)
          test "$version_output" = "$OPENCODE_VERSION"
          printf '%s\n' "$version_output" | tee "$RUNNER_TEMP/candidate-evidence/version.txt"
          OPENCODE_VERSION="$OPENCODE_VERSION" bun run packages/opencode/script/release-probe.ts \
            x64 "$extracted/opencode" "$RUNNER_TEMP/candidate-proof" 2>&1 | tee "$RUNNER_TEMP/candidate-evidence/probe.log"
          test -z "$(git -C source status --porcelain)"
          python3 - "$RUNNER_TEMP" "$RELEASE_TAG" "$SOURCE_COMMIT" "$OPENCODE_VERSION" "$BUN_VERSION" "$sidecar_name" "$PROOF_HARNESS_HEAD" <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          archive = root / "candidate-assets/opencode-linux-x64.tar.gz"
          def sha256(file):
              return hashlib.sha256(file.read_bytes()).hexdigest()
          metadata = {
              "release_tag": sys.argv[2],
              "release_source_commit": sys.argv[3],
              "version": sys.argv[4],
              "bun_version": sys.argv[5],
              "fff_sidecar": sys.argv[6],
              "proof_harness_head": sys.argv[7],
              "build_classification": "native linux-x64 candidate from clean selected source; no source overlays",
              "runner_arch": subprocess.check_output(["uname", "-m"], text=True).strip(),
              "actions_run_id": "${{ github.run_id }}",
              "actions_run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "bun_lock_sha256": sha256(pathlib.Path("source/bun.lock")),
              "models_dev_sha256": sha256(root / "candidate-evidence/models.dev.json"),
              "archive": archive.name,
              "archive_bytes": archive.stat().st_size,
              "archive_sha256": sha256(archive),
              "binary_sha256": sha256(root / "candidate-extracted/opencode"),
              "fff_sidecar_sha256": sha256(root / "candidate-extracted" / sys.argv[6]),
              "proof": json.loads((root / "candidate-proof/evidence.json").read_text()),
          }
          (root / "candidate-evidence/provenance.json").write_text(json.dumps(metadata, indent=2) + "\n")
          print(json.dumps(metadata, indent=2))
          PY

      - name: Upload verified native candidate and input evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-linux-x64-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/candidate-assets/*
            ${{ runner.temp }}/candidate-evidence/*
            ${{ runner.temp }}/candidate-proof/evidence.json
            ${{ runner.temp }}/candidate-proof/opencode-server.log
          if-no-files-found: error
          retention-days: 14
