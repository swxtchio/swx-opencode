name: typecheck

on:
  push:
    branches: [swxtch]
  pull_request:
    branches: [swxtch]
  workflow_dispatch:

env:
  # Turborepo telemetry is on by default and POSTs anonymous usage data to
  # Vercel. This fork runs only these two workflows, so opting out here is the
  # whole surface. Raised by sol during the #22 review as the one outward-facing
  # action still reachable from this fork.
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run typecheck
        run: bun typecheck
