name: test

on:
  push:
    branches:
      - swxtch
  pull_request:
  workflow_dispatch:

concurrency:
  # Keep every run on swxtch so cancelled checks do not pollute the default branch
  # commit history. PRs and other branches still share a group and cancel stale runs.
  group: ${{ case(github.ref == 'refs/heads/swxtch', format('{0}-{1}', github.workflow, github.run_id), format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref)) }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  # Turborepo telemetry is on by default and POSTs anonymous usage data to
  # Vercel. This fork runs only these two workflows, so opting out here is the
  # whole surface. Raised by sol during the #22 review as the one outward-facing
  # action still reachable from this fork.
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  unit:
    name: unit (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-latest
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Check workflow repository guards
        run: bun run script/check-workflow-guards.ts

      - name: Test the fork guards
        # The root bunfig.toml deliberately points `bun test` at a
        # non-existent directory to stop tests running from the repository
        # root, so these run from the script directory. Named explicitly rather
        # than letting bun scan: a bare `bun test` here would also collect
        # translate-app.test.ts, which is not part of this gate.
        working-directory: script
        # `ls` first: bun ignores a positional filter that matches nothing as
        # long as another matches, so a renamed test file would silently drop
        # out of this gate instead of failing it.
        run: |
          ls audit-checks.test.ts audit-cli.test.ts guard-expression.test.ts github/same-repo-guard.test.ts github/close-scripts-guard.test.ts github/write-guard-coverage.test.ts > /dev/null
          bun test audit-checks.test.ts audit-cli.test.ts guard-expression.test.ts github/same-repo-guard.test.ts github/close-scripts-guard.test.ts github/write-guard-coverage.test.ts

      - name: Test the fork maintenance scripts
        # Kept out of the fork-guard gate above: these are fork tooling, not
        # guards, and that gate's contents are pinned by the audit. `ls` first
        # for the same reason as there: a renamed file must fail, not vanish.
        working-directory: script
        run: |
          ls sync-upstream.test.ts changeset-check.test.ts > /dev/null
          bun test sync-upstream.test.ts changeset-check.test.ts

      - name: Check the fork changeset
        # A PR against swxtch must add its entry to CHANGESET.md. Passed through
        # env, never interpolated into the script, since the head ref is
        # attacker-chosen on a fork PR.
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_REF: ${{ github.base_ref }}
        run: bun script/changeset-check.ts

      # Correctness-only lint gate. `bun run lint` exits 0 on this repository
      # because .oxlintrc.json sets almost everything to "warn" - including
      # no-dupe-keys, which is how a duplicate key in an e2e mock config
      # survived and produced a test that failed three attempts in one run.
      # This config promotes only rules where a hit is almost certainly a bug,
      # and runs with typeAware off so it costs ~2s rather than OOMing.
      # #11: dependabot on this repository uses the npm ecosystem, which does
      # not maintain bun.lock, so a bump can land package.json alone and the
      # lockfile silently drifts. Nothing caught it before, because no workflow
      # used --frozen-lockfile. The drift it reported has since been
      # reconciled; this is what stops the next one.
      - name: Verify the lockfile matches the manifests
        run: bun install --frozen-lockfile

      - name: Lint for correctness bugs
        # Through the script so it uses the pinned oxlint devDependency
        # rather than whatever `bunx` would fetch.
        run: bun run lint:correctness

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-
            turbo-${{ runner.os }}-

      - name: Run unit tests
        timeout-minutes: 20
        run: GITHUB_ACTIONS=false bun turbo test
        env:
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}

      - name: Check generated client
        if: runner.os == 'Linux'
        working-directory: packages/client
        run: bun run check:generated

      - name: Run HttpApi exerciser gates
        if: runner.os == 'Linux'
        working-directory: packages/opencode
        run: bun run test:httpapi

  e2e:
    name: e2e (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-latest
    runs-on: ${{ matrix.settings.host }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Playwright 1.59 hangs while extracting Chromium with Node 24.16.
          node-version: "24.15"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright system dependencies
        if: runner.os == 'Linux'
        working-directory: packages/app
        run: bunx playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/app
        run: bunx playwright install chromium

      # Informational, not gating. This suite is upstream's (packages/app/e2e)
      # and this fork does not maintain it, so its flake must not block our
      # feature work. #26 documents the known provider-bootstrap failure that
      # makes review-line-comment fail every attempt in a run. Artifacts are
      # still uploaded, so the signal is kept -- it just does not gate.
      - name: Run app e2e tests
        id: e2e
        continue-on-error: true
        run: bun --cwd packages/app test:e2e:local
        env:
          CI: true
        timeout-minutes: 30

      - name: Report the e2e outcome
        if: steps.e2e.outcome == 'failure'
        run: |
          echo "::warning::app e2e suite failed. This does not gate merges: the suite is upstream's and this fork does not maintain it. See #26."

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ matrix.settings.name }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/app/e2e/test-results
            packages/app/e2e/playwright-report
